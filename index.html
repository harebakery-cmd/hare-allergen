  <!-- 즉시 렌더링되는 로딩 스플래시 (스크립트 로드 전부터 표시) -->
  <style>
    #splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .35s ease}
    #splash.hide{opacity:0;pointer-events:none}
    .s-icon{font-size:44px;animation:sbounce .9s ease-in-out infinite alternate}
    .s-text{font-size:15px;color:#555;font-weight:600;font-family:sans-serif}
    .s-bar{width:180px;height:4px;background:#e5e5e5;border-radius:4px;overflow:hidden}
    .s-fill{height:100%;background:#2563eb;border-radius:4px;animation:sslide 1.3s ease-in-out infinite}
    @keyframes sbounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    @keyframes sslide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  </style>

  <style>

    *{box-sizing:border-box;margin:0;padding:0}

    .app{max-width:1400px;margin:0 auto;padding:0 16px 80px}
    .header{background:#1a1a2e;color:white;padding:20px 24px;margin-bottom:24px;border-radius:0 0 20px 20px}

    .allergen-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:white;padding:14px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .filter-label{width:100%;font-size:12px;font-weight:700;color:#666;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
    .allergen-chip{padding:5px 12px;border-radius:50px;border:2px solid #e0e0e0;background:white;font-family:'Noto Sans KR',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;color:#555;white-space:nowrap}

    .filter-mode-btn.active-excludes{background:#2ed573;color:white}
    .results-info{font-size:13px;color:#888;margin-bottom:10px}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .product-card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}

    .product-card.selected{border-color:#1a1a2e}
    .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .product-name{font-size:15px;font-weight:700;color:#1a1a2e;line-height:1.3}

      .card-body{flex:1;min-width:0}
      .card-header{margin-bottom:6px;flex-wrap:wrap;gap:4px}
      .product-name{font-size:14px}
      .cat-badge{font-size:9px;padding:2px 8px}
      .allergen-tag{font-size:10px;padding:1px 7px}
      .card-arrow{font-size:18px;color:#ccc;flex-shrink:0}
    }
    @media(min-width:601px){.card-arrow{display:none}}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:white;border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{font-size:20px;font-weight:900;color:#1a1a2e}
    .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .detail-cat{display:inline-block;padding:4px 14px;border-radius:50px;font-size:12px;font-weight:700;margin-bottom:16px}
    .allergen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .allergen-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:500}
    .allergen-item.yes{background:#ffebee;color:#c62828}
    .allergen-item.no{background:#f5f5f5;color:#aaa}
    .allergen-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .allergen-dot.yes{background:#e53935}
    .allergen-dot.no{background:#ccc}
    .manage-section{background:white;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .manage-title{font-size:16px;font-weight:900;color:#1a1a2e;margin-bottom:16px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-size:12px;font-weight:700;color:#555}
    .form-input,.form-select{padding:10px 14px;border-radius:10px;border:2px solid #e0e0e0;font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;transition:border .2s;width:100%}
    .form-input:focus,.form-select:focus{border-color:#1a1a2e}

    .manage-private-title{font-size:13px;font-weight:900;color:#8a5a16;margin-bottom:4px}
    .manage-private-note{font-size:11px;color:#927a59;margin-bottom:12px}
    .origin-form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .allergen-form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .allergen-toggle{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:2px solid #e0e0e0;cursor:pointer;transition:all .15s;font-size:12px;background:white;font-family:'Noto Sans KR',sans-serif}
    .allergen-toggle.on{border-color:#ff4757;background:#ffebee;color:#c62828;font-weight:700}
    .btn{padding:10px 24px;border-radius:50px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
    .btn-primary{background:#1a1a2e;color:white}
    .btn-primary:hover{background:#2d2d4e}
    .btn-danger{background:#ff4757;color:white}
    .btn-secondary{background:#f0f0f0;color:#555}
    .btn-success{background:#2ed573;color:white}
    .btn-success:hover{background:#26bc62}
    .manage-table{width:100%;border-collapse:collapse;font-size:13px}
    .manage-table th{background:#1a1a2e;color:white;padding:10px 12px;text-align:left;font-weight:700}
    .manage-sort-header{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;
      color:inherit;font:inherit;font-weight:800;cursor:pointer}
    .manage-sort-header:hover{color:#7ee2aa}
    .manage-sort-arrow{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
      border:1px solid rgba(255,255,255,.45);border-radius:50%;font-size:10px;line-height:1}
    .manage-table th:first-child{border-radius:10px 0 0 0}
    .manage-table th:last-child{border-radius:0 10px 0 0}
    .manage-table td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
    .manage-table tr:hover td{background:#fafafa}
    .action-btns{display:flex;gap:6px}
    .btn-sm{padding:5px 12px;font-size:12px;border-radius:50px;border:none;font-family:'Noto Sans KR',sans-serif;font-weight:700;cursor:pointer}
    .btn-sm-edit{background:#e3f2fd;color:#1565c0}
    .btn-sm-del{background:#ffebee;color:#c62828}
    .empty-state{text-align:center;padding:60px 20px;color:#bbb}
    .empty-icon{font-size:48px;margin-bottom:12px}
    .stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .stat-card{flex:1;min-width:120px;background:white;border-radius:12px;padding:14px 16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .stat-num{font-size:28px;font-weight:900;font-family:'Montserrat',sans-serif;color:#1a1a2e}
    .stat-label{font-size:11px;color:#888;margin-top:2px}
    .lock-overlay{position:fixed;inset:0;background:rgba(26,26,46,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .lock-box{background:white;border-radius:24px;padding:32px;width:100%;max-width:360px;text-align:center}
    .lock-icon{font-size:48px;margin-bottom:16px}
    .lock-title{font-size:20px;font-weight:900;color:#1a1a2e;margin-bottom:6px}
    .lock-sub{font-size:13px;color:#888;margin-bottom:24px}
    .lock-input{width:100%;padding:12px 16px;border-radius:12px;border:2px solid #e0e0e0;font-size:18px;text-align:center;letter-spacing:6px;outline:none;font-family:monospace;transition:border .2s}
    .lock-input:focus{border-color:#1a1a2e}
    .lock-error{color:#e53935;font-size:12px;margin-top:8px;min-height:18px}
    .lock-btns{display:flex;gap:10px;margin-top:20px}
    .pw-manage{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#f7f3ee;border-radius:12px;margin-bottom:16px;font-size:13px}
    .pw-manage-label{flex:1;color:#555;font-weight:600}
    .lock-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:50px}
    .lock-status.unlocked{background:#e8f5e9;color:#2e7d32}
    .btn-sm-hide{background:#fff3cd;color:#856404}
    .btn-sm-show{background:#e8f5e9;color:#2e7d32}
    .manage-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    .manage-filter-btn{padding:7px 16px;border-radius:50px;border:2px solid #e0e0e0;background:white;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;color:#555;white-space:nowrap}
    .manage-filter-btn.active{background:#1a1a2e;color:white;border-color:#1a1a2e}
    .manage-table tr.hidden-row td{opacity:0.4}
    .hidden-badge{font-size:10px;padding:1px 7px;border-radius:50px;background:#f0f0f0;color:#aaa;font-weight:600;margin-left:6px}
    .manage-table td .product-hidden-label{font-size:10px;color:#aaa;margin-left:4px}
    @media(max-width:600px){
      .allergen-form-grid{grid-template-columns:repeat(3,1fr)}
      .form-row{grid-template-columns:1fr}
      .origin-form-grid{grid-template-columns:1fr}
      .allergen-grid{grid-template-columns:repeat(2,1fr)}
    }
  
    .allergen-zero-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0;margin-bottom:12px;user-select:none;font-size:13px;font-weight:600;color:#555}
    .toggle-switch{width:36px;height:20px;border-radius:10px;background:#ddd;position:relative;transition:background .2s;flex-shrink:0}
    .toggle-switch::after{content:"";position:absolute;width:16px;height:16px;background:white;border-radius:50%;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .toggle-switch.on{background:#1a1a2e}
    .toggle-switch.on::after{transform:translateX(16px)}

    /* Dub — rice-paper link dashboard theme */
    :root{
      --forest:#171717;
      --forest-shadow:#0a0a0a;
      --sage:#dbeafe;
      --keylime:#f5f5f5;
      --mint:#f5f5f5;
      --slate:#f5f5f5;
      --cream:#ffffff;
      --charcoal:#171717;
      --mist:#e5e5e5;
      --blue:#2563eb;
      --blue-dark:#1e40af;
      --blue-wash:#eff6ff;
      --muted:#737373;
    }
    body{font-family:'Inter','Noto Sans KR',sans-serif;background:var(--cream);color:var(--charcoal)}
    .app{max-width:1200px;padding:0 18px 72px}
    .header{background:var(--cream);color:var(--forest);padding:26px 4px 20px;margin-bottom:16px;border-bottom:1px solid var(--mist);border-radius:0}
    .header h1{font-family:'Inter','Noto Sans KR',sans-serif;font-size:26px;font-weight:600;line-height:1.3;letter-spacing:-.035em}
    .header p{color:var(--muted);font-size:13px;font-weight:400;line-height:1.5}
    .header .production-notice{max-width:900px;margin-top:8px;color:#404040;font-weight:500;word-break:keep-all}
    .header .customer-notice{max-width:900px;margin-top:4px;color:var(--blue-dark);font-weight:600;word-break:keep-all}
    .tab-bar{gap:6px;margin-bottom:18px}
    .tab-btn,.sort-btn,.manage-filter-btn{border:1px solid var(--mist);background:var(--cream);color:var(--forest);border-radius:8px;box-shadow:none}
    .tab-btn{padding:9px 18px}
    .tab-btn.active,.sort-btn.active,.manage-filter-btn.active{background:var(--forest);border-color:var(--forest);color:var(--cream)}
    .search-row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(160px,220px) minmax(150px,200px) auto auto;gap:8px;background:var(--cream);padding:12px;border:1px solid var(--mist);border-radius:12px}
    .search-input,.cat-select,.store-select{min-width:0;width:100%;height:42px;padding:9px 12px;border:1px solid #d4d4d4;border-radius:6px;background:var(--cream);color:var(--charcoal);font:inherit;outline:none}
    .search-input{border-color:#111827}
    .search-input:focus,.cat-select:focus,.store-select:focus,.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .allergen-filters{background:var(--cream);border:1px solid var(--mist);border-radius:12px;box-shadow:none;padding:16px}
    .filter-label{color:var(--forest);font-size:12px;text-transform:none;letter-spacing:0}
    .filter-label::before{content:"";display:inline-block;width:3px;height:12px;margin-right:7px;border-radius:2px;background:var(--blue);vertical-align:-1px}
    .filter-mode-toggle{border:1px solid var(--forest)}
    .filter-mode-btn{color:var(--forest);background:var(--cream)}
    .filter-mode-btn.active-contains,.filter-mode-btn.active-excludes{background:var(--forest);color:var(--cream)}
    .allergen-chip{border:1px solid #d4d4d4;background:var(--cream);color:#404040}
    .allergen-chip.selected,.allergen-chip.selected-exclude{background:var(--forest);border-color:var(--forest);color:var(--cream)}
    .product-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .product-card{background:var(--cream);border:1px solid var(--mist);border-radius:12px;box-shadow:none;padding:18px;min-width:0}
    .product-card:nth-child(3n+2),.product-card:nth-child(3n){background:var(--cream)}
    .product-card:hover{transform:none;box-shadow:none;border-color:#c8c8c8;background:#fafafa}
    .product-card.selected{border-color:var(--blue)}
    .card-header{gap:12px;margin-bottom:13px}
    .product-name,.modal-title,.manage-title{color:var(--forest)}
    .product-name{font-size:17px;font-weight:600;line-height:1.45;letter-spacing:-.025em}
    .cat-badge{border-radius:6px!important;font-size:11px;padding:4px 8px}
    .allergen-tags{gap:6px;padding-top:12px;border-top:1px solid #f0f0f0}
    .allergen-tags::before{content:"알레르기";width:100%;color:var(--muted);font-size:11px;font-weight:500;line-height:1.4}
    .allergen-tag{background:var(--blue-wash);border:0;color:var(--blue-dark);font-size:12px;line-height:1.4;padding:4px 9px}
    .allergen-tag.danger{background:var(--forest);border-color:var(--forest);color:var(--cream)}
    .store-dot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
